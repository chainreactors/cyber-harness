version: 2

project_name: aiscan

# This file is the build definition for the release workflow, which drives it
# one target at a time:
#
#     GOOS=<goos> GOARCH=<goarch> goreleaser build --id <id> --single-target
#
# `goreleaser build` exists for exactly that: ldflags, build tags and the CGO
# switch get written down once here instead of being spelled out per profile in
# release-build.yml. Every target keeps the toolchain it already had — an arm64
# runner for linux/arm64, Zig plus a pinned macOS SDK for Darwin, MinGW for
# Windows — because `--single-target` builds whatever GOOS/GOARCH say, on
# whichever runner happens to have that toolchain.
#
# That also means the caller supplies the platform-specific link environment:
# CGO_LDFLAGS pointing at the fetched RE2 SDK, and CC/CXX for Darwin. Both ride
# in through the process environment, which GoReleaser inherits.
#
# Packaging and publishing are deliberately absent. release-build.yml still
# zips README and docs together with UPX and a checksum, and go-release.yml
# still creates the GitHub Release from the curated docs/changelog.md, so
# `goreleaser release` is never run.
#
# The build tags come from editions.env, the same file the Makefile and the
# workflows read; nothing here restates them.

# Scratch space, not an output: every invocation copies the binary out with
# `-o`. It sits under .cache/ so the `--clean` each invocation needs — a second
# run refuses to start against a non-empty dist — cannot touch the dist/build
# directory the workflow collects artifacts in.
dist: .cache/goreleaser

builds:
  - id: aiscan
    main: ./cmd/aiscan
    binary: aiscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    tags:
      - '{{ .Env.STANDARD_TAGS }}'
    ldflags:
      - -s -w -X github.com/chainreactors/cyber/core/config.Version={{ .Version }}

  - id: aiscan-full
    main: ./cmd/aiscan
    binary: aiscan-full
    env:
      # The full edition links the native libcstx runtime and the static RE2
      # SDK, both of which are cgo-only.
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    tags:
      - '{{ .Env.FULL_TAGS }}'
    ldflags:
      # External linking is what makes the Darwin cross-build able to use Zig's
      # linker; on linux and windows cgo already links externally by default.
      - -linkmode=external
      - -s -w -X github.com/chainreactors/cyber/core/config.Version={{ .Version }}

  # Never a release asset: built and smoke-tested so Cairn's runner keeps
  # compiling on every platform this repository supports. It carries no tags,
  # unlike the aiscan editions above.
  - id: runner
    main: ./cmd/runner
    binary: runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/chainreactors/cyber/core/config.Version={{ .Version }}
