syntax = "proto3";

package cyber.rpc.config;

import "types/config.proto";

option go_package = "github.com/chainreactors/cyber/pkg/rpc;rpc";

service ConfigService {
  rpc GetConfig(cyber.config.GetConfigRequest) returns (cyber.config.GetConfigResponse);
  rpc UpdateConfig(cyber.config.UpdateConfigRequest) returns (cyber.config.UpdateConfigResponse);
  rpc ActivateProfile(cyber.config.ActivateProfileRequest) returns (cyber.config.ActivateProfileResponse);
  rpc TestLLM(cyber.config.LLMProbeRequest) returns (cyber.config.LLMProbeResult);
  rpc ListModels(cyber.config.LLMProbeRequest) returns (cyber.config.ListModelsResult);
  rpc TestConnection(cyber.config.TestConnectionRequest) returns (cyber.config.TestConnectionResponse);
}
