syntax = "proto3";

package cyber.rpc.scan;

import "types/scan.proto";

option go_package = "github.com/chainreactors/cyber/pkg/rpc;rpc";

service ScanService {
  rpc SubmitScan(cyber.scan.SubmitScanRequest) returns (cyber.scan.SubmitScanResponse);
  rpc GetScan(cyber.scan.GetScanRequest) returns (cyber.scan.GetScanResponse);
  rpc ListScans(cyber.scan.ListScansRequest) returns (cyber.scan.ListScansResponse);
  rpc CancelScan(cyber.scan.CancelScanRequest) returns (cyber.scan.CancelScanResponse);
  rpc GetScanReport(cyber.scan.GetScanReportRequest) returns (cyber.scan.GetScanReportResponse);
}
