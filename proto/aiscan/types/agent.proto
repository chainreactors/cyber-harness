syntax = "proto3";

package aiscan.agent;

import "aop/protocol.proto";
import "aiscan/types/command.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/chainreactors/aiscan/pkg/types/agent;agent";

message View {
  aop.AgentHello hello = 1;
  aop.AgentStatus status = 2;
  aop.AgentStats stats = 3;
  string node_uri = 4;
  google.protobuf.Timestamp connected_at = 5;
  repeated aiscan.command.Spec commands = 6;
  bool busy = 7;
}

message LocalAgent {
  string name = 1;
  int32 pid = 2;
  bool registered = 3;
  bool busy = 4;
}

message ListAgentsRequest {}
message ListAgentsResponse { repeated View agents = 1; }
message ListLocalAgentsRequest {}
message ListLocalAgentsResponse { repeated LocalAgent agents = 1; }
message LaunchLocalAgentRequest {}
message LaunchLocalAgentResponse { LocalAgent agent = 1; }
message StopLocalAgentRequest { string name = 1; }
message StopLocalAgentResponse {}

message RunOptions {
  string eval_criteria = 1;
  uint32 eval_max_rounds = 2;
}

message CommandDetail {
  string line = 1;
  string presentation = 2;
}

message CompactDetail {
  string error = 1;
  uint64 kept_messages = 2;
  uint64 tokens_after = 3;
  uint64 tokens_before = 4;
}

message DelegationDetail {
  string agent_id = 1;
  string agent_name = 2;
  string agent_type = 3;
  string context_mode = 4;
  string run_mode = 5;
  string task = 6;
}

message EvalControl {
  string criteria = 1;
  uint32 max_rounds = 2;
}

message EvalDetail {
  string error = 1;
  uint32 max_rounds = 2;
  bool pass = 3;
  string reason = 4;
  uint32 round = 5;
}

message BudgetWarning {
  uint64 context_tokens = 1;
  uint64 token_budget = 2;
}

message LLMRequestDetail {
  string model = 1;
  uint32 messages = 2;
  uint32 max_tokens = 3;
  bool stream = 4;
}

message WebMessageMetadata {
  string agent_id = 1;
  string code = 2;
  google.protobuf.Struct params = 3;
}
