syntax = "proto3";

package aiscan.config;

option go_package = "github.com/chainreactors/aiscan/pkg/types/config;config";

message DistributeConfig {
  LLMConfig llm = 1;
  CyberhubConfig cyberhub = 2;
  ReconConfig recon = 3;
  ScanConfig scan = 4;
  SearchConfig search = 5;
  IOAConfig ioa = 6;
  AgentConfig agent = 7;
}

message LLMConfig {
  string active_profile = 1;
  repeated LLMProviderConfig providers = 2;
}

message LLMProviderConfig {
  string id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4;
  string api_key = 5;
  string model = 6;
  string proxy = 7;
  int32 max_tokens = 8;
  int32 context_window = 9;
}

message CyberhubConfig {
  string url = 1;
  string key = 2;
  string mode = 3;
  string proxy = 4;
}

message ReconConfig {
  string fofa_email = 1;
  string fofa_key = 2;
  string hunter_token = 3;
  string hunter_api_key = 4;
  string proxy = 5;
  int32 limit = 6;
}

message ScanConfig {
  string verify = 1;
}

message SearchConfig {
  string tavily_keys = 1;
}

message IOAConfig {
  string url = 1;
  string token = 2;
  string node_name = 3;
  string space = 4;
}

message AgentConfig {
  repeated string tools = 1;
  int32 timeout = 2;
  bool save_session = 3;
}

message LLMProviderView {
  string id = 1;
  string name = 2;
  string provider = 3;
  string base_url = 4;
  bool api_key_configured = 5;
  string model = 6;
  string proxy = 7;
  int32 max_tokens = 8;
  int32 context_window = 9;
}

message LLMView {
  string active_profile = 1;
  LLMProviderView active = 2;
  repeated LLMProviderView providers = 3;
}

message CyberhubView {
  string url = 1;
  bool key_configured = 2;
  string mode = 3;
  string proxy = 4;
}

message ReconView {
  string fofa_email = 1;
  bool fofa_key_configured = 2;
  bool hunter_token_configured = 3;
  bool hunter_api_key_configured = 4;
  string proxy = 5;
  int32 limit = 6;
}

message SearchView { bool tavily_keys_configured = 1; }

message IOAView {
  string url = 1;
  bool token_configured = 2;
  string node_name = 3;
  string space = 4;
}

message ConfigView {
  string path = 1;
  bool loaded = 2;
  LLMView llm = 3;
  CyberhubView cyberhub = 4;
  ReconView recon = 5;
  ScanConfig scan = 6;
  SearchView search = 7;
  IOAView ioa = 8;
  AgentConfig agent = 9;
}

message GetConfigResponse { ConfigView config = 1; }
message UpdateConfigRequest { DistributeConfig config = 1; }
message UpdateConfigResponse { ConfigView config = 1; }
message ActivateProfileRequest { string profile_id = 1; }
message ActivateProfileResponse { ConfigView config = 1; }

message LLMProbeRequest {
  string profile_id = 1;
  string provider = 2;
  string base_url = 3;
  string api_key = 4;
  string model = 5;
  string proxy = 6;
}

message LLMProbeResult {
  bool ok = 1;
  string provider = 2;
  string model = 3;
  int64 latency_ms = 4;
  string reply = 5;
  string error = 6;
}

message ListModelsResult {
  bool ok = 1;
  bool supported = 2;
  repeated string models = 3;
  string error = 4;
}

message TestConnectionRequest {
  string section = 1;
  DistributeConfig config = 2;
}

message ConnectionCheck {
  string name = 1;
  bool ok = 2;
  int64 latency_ms = 3;
  string detail = 4;
  string error = 5;
}

message TestConnectionResponse { repeated ConnectionCheck checks = 1; }
