syntax = "proto3";

package aiscan.transport;

import "aiscan/transport/operation.proto";
import "aiscan/transport/telemetry.proto";
import "aiscan/transport/terminal.proto";
import "aop/chat.proto";
import "aop/content.proto";
import "aop/event.proto";
import "aop/value.proto";

option go_package = "github.com/chainreactors/aiscan/aop/aiscan/transport;transport";

message AgentHello {
  string agent_id = 1;
  string name = 2;
  string authority = 3;
  repeated string commands = 4;
  repeated CommandSpec command_menu = 5;
  repeated ToolDefinition tools = 6;
  AgentRuntimeInfo runtime = 7;
  AgentStatus status = 8;
  AgentStats stats = 9;
}

message ConnectionAccepted {
  string agent_id = 1;
  string name = 2;
  repeated string capabilities = 3;
}

message ToolCallRequest {
  string task_id = 1;
  string session_id = 2;
  string turn_id = 3;
  aop.ToolCall call = 4;
}

message AgentFrame {
  string frame_id = 1;
  string correlation_id = 2;
  oneof payload {
    AgentHello hello = 10;
    aop.OpenSessionResponse open_session = 11;
    aop.RunTurnResponse run_turn = 12;
    aop.CancelTurnResponse cancel_turn = 13;
    aop.CloseSessionResponse close_session = 14;
    aop.Event event = 15;
    CommandResult command_result = 16;
    FileResult file_result = 17;
    ExecOutput exec_output = 18;
    ExecResult exec_result = 19;
    OperationError operation_error = 20;
    AgentStatus status = 21;
    AgentStats stats = 22;
    ConfigReloadResult config_reload = 23;
    TerminalFrame terminal = 24;
    ToolTelemetry tool_telemetry = 25;
    ScoNodes sco_nodes = 26;
  }
}

message ServerFrame {
  string frame_id = 1;
  string correlation_id = 2;
  oneof payload {
    ConnectionAccepted accepted = 10;
    aop.OpenSessionRequest open_session = 11;
    aop.RunTurnRequest run_turn = 12;
    aop.CancelTurnRequest cancel_turn = 13;
    aop.CloseSessionRequest close_session = 14;
    CommandRequest command = 15;
    ToolCallRequest tool_call = 16;
    FileReadRequest file_read = 17;
    FileWriteRequest file_write = 18;
    FileListRequest file_list = 19;
    FileMkdirRequest file_mkdir = 20;
    FileUploadRequest file_upload = 21;
    ExecRequest exec = 22;
    CancelOperation cancel_operation = 23;
    ReloadConfig reload_config = 24;
    TerminalFrame terminal = 25;
    aop.Extension extension = 26;
  }
}

service AgentTransportService {
  rpc Connect(stream AgentFrame) returns (stream ServerFrame);
}
