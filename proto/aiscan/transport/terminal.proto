syntax = "proto3";

package aiscan.transport;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/chainreactors/aiscan/aop/aiscan/transport;transport";

message TerminalInfo {
  string id = 1;
  string kind = 2;
  string name = 3;
  string command = 4;
  int32 pid = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp last_activity_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  int64 activity_seq = 9;
  int64 output_bytes = 10;
  int32 exit_code = 11;
  string state = 12;
  string kill_cause = 13;
}

message TerminalFrame {
  string type = 1;
  string stream_id = 2;
  string session_id = 3;
  string kind = 4;
  string name = 5;
  string command = 6;
  repeated string args = 7;
  bytes data = 8;
  int32 cols = 9;
  int32 rows = 10;
  int32 bytes = 11;
  int64 offset = 12;
  bool singleton = 13;
  string error = 14;
  string state = 15;
  int32 exit_code = 16;
  TerminalInfo session = 17;
  repeated TerminalInfo sessions = 18;
}
