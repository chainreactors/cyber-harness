syntax = "proto3";

package cyber.chat;

import "aop/chat.proto";
import "types/command.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/chainreactors/cyber/core/types;types";

// SessionHistory is persisted as an AOP event extension. It makes transcript
// inheritance explicit without changing the shared AOP protocol schema.
message SessionHistory {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_INHERIT = 1;
    MODE_SNAPSHOT = 2;
  }
  Mode mode = 1;
}

message SessionRecord {
  reserved 3;
  aop.Session session = 1;
  string agent_name = 2;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  map<string, google.protobuf.Struct> extensions = 6;
  bool archived = 7;
}

message ListSessionsRequest {
  string after_cursor = 1;
  uint32 limit = 2;
  bool include_closed = 3;
  string search = 4;
  string node_id = 5;
  optional bool archived = 6;
  string target = 7;
}

message ListSessionsResponse {
  repeated SessionRecord sessions = 1;
  string next_cursor = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  SessionRecord session = 1;
}

message ResetSessionRequest {
  string request_id = 1;
  string session_id = 2;
  string new_session_id = 3;
  string title = 4;
}

message ResetSessionReceipt {
  aop.Session previous = 1;
  SessionRecord current = 2;
}

message ResetSessionResponse {
  string request_id = 1;
  oneof outcome {
    ResetSessionReceipt accepted = 2;
    aop.Rejection rejected = 3;
  }
}

message DeleteSessionRequest {
  string request_id = 1;
  string session_id = 2;
}

message DeleteSessionResponse {
  string request_id = 1;
  oneof outcome {
    aop.Session accepted = 2;
    aop.Rejection rejected = 3;
  }
}

message ListCommandsRequest {
  string session_id = 1;
}

message ListCommandsResponse {
  repeated cyber.command.CommandSpec commands = 1;
}

// Updates presentation metadata without changing execution or node binding.
message UpdateSessionRequest {
  string request_id = 1;
  string session_id = 2;
  optional string title = 3;
  optional bool archived = 4;
}
message UpdateSessionResponse {
  string request_id = 1;
  oneof outcome {
    SessionRecord accepted = 2;
    aop.Rejection rejected = 3;
  }
}
