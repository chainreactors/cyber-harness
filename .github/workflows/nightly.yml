name: nightly

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = CST 00:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
      target: ${{ steps.nightly.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set nightly tag
        id: nightly
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="v0.0.0-nightly.${DATE}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "target=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Create nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push --force origin "$TAG"

  release:
    needs: prepare
    uses: ./.github/workflows/go-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      target: ${{ needs.prepare.outputs.target }}
      prerelease: true
    secrets: inherit

  cleanup:
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Delete superseded nightly releases
        run: |
          gh release list --limit 50 --json tagName \
            | jq -r '.[] | select(.tagName | startswith("v0.0.0-nightly.")) | .tagName' \
            | while read -r tag; do
                if [[ "${tag}" == "${TAG}" ]]; then
                  continue
                fi
                echo "Deleting release ${tag}"
                gh release delete "${tag}" --yes --cleanup-tag || true
              done
