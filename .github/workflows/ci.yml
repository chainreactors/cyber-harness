name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Check go mod tidy
        run: |
          cp go.mod "$RUNNER_TEMP/go.mod.before"
          cp go.sum "$RUNNER_TEMP/go.sum.before"
          for attempt in 1 2 3; do
            if go mod tidy; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "go mod tidy failed, retrying ($attempt/3)..."
            sleep $((attempt * 5))
          done
          if ! cmp -s go.mod "$RUNNER_TEMP/go.mod.before" || \
             ! cmp -s go.sum "$RUNNER_TEMP/go.sum.before"; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            diff -u "$RUNNER_TEMP/go.mod.before" go.mod || true
            diff -u "$RUNNER_TEMP/go.sum.before" go.sum | head -30 || true
            exit 1
          fi

      - name: Check AOP module tidy
        working-directory: aop
        run: |
          cp go.mod "$RUNNER_TEMP/aop.go.mod.before"
          cp go.sum "$RUNNER_TEMP/aop.go.sum.before"
          for attempt in 1 2 3; do
            if go mod tidy; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "aop go mod tidy failed, retrying ($attempt/3)..."
            sleep $((attempt * 5))
          done
          if ! cmp -s go.mod "$RUNNER_TEMP/aop.go.mod.before" || \
             ! cmp -s go.sum "$RUNNER_TEMP/aop.go.sum.before"; then
            echo "::error::aop/go.mod or aop/go.sum is not tidy. Run 'cd aop && go mod tidy' and commit the result."
            diff -u "$RUNNER_TEMP/aop.go.mod.before" go.mod || true
            diff -u "$RUNNER_TEMP/aop.go.sum.before" go.sum | head -30 || true
            exit 1
          fi

      - name: Check repository architecture and dependencies
        run: go test -count=1 ./core/resource ./core/extension ./core/registry ./pkg/exts ./cmd/agent

      - name: Build the minimal agent
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/agent
          if go list -deps ./cmd/agent | grep -Eq '^github\.com/chainreactors/cyber/(.*/)?(scanner|search|proxy|ioa|browser|record|web)(/|$)'; then
            echo "::error::cmd/agent reaches a product feature outside the minimal agent graph"
            exit 1
          fi

      # The retained native CSTX Extension is not part of any product edition;
      # browser builds use @cyber/cstx WASM.
      - name: Ensure aiscan does not depend on libcstx
        run: |
          if CGO_ENABLED=0 go list -deps \
            -tags "$STANDARD_TAGS" ./cmd/aiscan \
            | grep -q '^github.com/chainreactors/libcstx/go$'; then
            echo "::error::aiscan reaches the dormant native CSTX Extension"
            exit 1
          fi
          for cgo in 0 1; do
            if CGO_ENABLED="$cgo" go list -deps \
              -tags "$FULL_TAGS" ./cmd/aiscan \
              | grep -q '^github.com/chainreactors/libcstx/go$'; then
              echo "::error::aiscan-full reaches the dormant native CSTX Extension with CGO_ENABLED=$cgo"
              exit 1
            fi
          done

      - name: Enforce native Extension ownership
        run: |
          tracked_native="$(git ls-files -- '*.a' '*.lib' '*.dll' '*.so' '*.dylib')"
          if [[ -n "$tracked_native" ]]; then
            printf '%s\n' "$tracked_native"
            echo "::error::native libraries must come from pinned modules or Release SDKs, not the aiscan Git tree"
            exit 1
          fi
          libcstx_imports="$(git grep -l 'github.com/chainreactors/libcstx/go' -- '*.go' || true)"
          if printf '%s\n' "$libcstx_imports" | grep -v '^pkg/exts/cstx/' | grep -q .; then
            echo "::error::libcstx may only be imported by pkg/exts/cstx"
            exit 1
          fi
          if git grep -n -E 'go-astiav|#cgo[[:space:]]+pkg-config' -- pkg/exts/record tools/record; then
            echo "::error::record must link only through its Extension-owned FFI"
            exit 1
          fi

      - name: Ensure the full edition builds with and without cgo
        run: |
          CGO_ENABLED=0 go build -tags "$FULL_TAGS" -o /dev/null ./cmd/aiscan
          CGO_ENABLED=1 go build -tags "$FULL_TAGS" -o /dev/null ./cmd/aiscan

      - name: Run go vet
        run: go vet ./...

      - name: Compile public scanner regressions
        run: |
          go test -run '^$' -tags "$FULL_CAPS_TAGS integration" ./pkg/exts/scanner

      - name: Check whitespace and submodule pins
        run: |
          git diff --check HEAD
          git diff --ignore-submodules=dirty --exit-code -- \
            .gitmodules templates web/frontend/cyber-ui

      # release-build.yml drives `goreleaser build` from this file, so a field
      # this repository cannot spell correctly would otherwise surface for the
      # first time during a release.
      - name: Check the release build definition
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.13.0
          args: check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=8m
          skip-cache: ${{ env.ACT == 'true' }}

  test:
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Generate embedded resources
        run: go generate ./tools/resources/...

      - name: Run AOP module tests
        working-directory: aop
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Run unit tests with coverage
        run: |
          test_args=(-timeout 5m)
          if [[ "${ACT:-}" == "true" ]]; then
            test_args=(-timeout 10m -p 4)
          fi
          package_list="$(go list ./...)"
          # The product-process harness is intentionally manual-only.
          mapfile -t packages < <(printf '%s\n' "$package_list" | grep -v '^github.com/chainreactors/cyber/cmd/harness\(/\|$\)')
          go test -race -count=1 "${test_args[@]}" \
            -coverprofile=coverage.out \
            -covermode=atomic \
            "${packages[@]}"

      - name: Enforce coverage floor
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          if [[ -z "$coverage" ]]; then
            echo "::error::unable to read total coverage"
            exit 1
          fi
          if ! awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 >= 50.0) }'; then
            echo "::error::total coverage ${coverage}% is below the 50.0% floor"
            exit 1
          fi
          echo "Total coverage ${coverage}% meets the 50.0% floor"

      - name: Check generated resources are committed
        run: git diff --exit-code -- tools/resources/template.go

      - name: Display coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Root module coverage"
            go tool cover -func=coverage.out | tail -1
            echo ""
            echo "### Per-package coverage (top 20)"
            go tool cover -func=coverage.out | grep -E '^[a-z]' | sort -t$'\t' -k3 -rn | head -20
          fi
          if [ -f aop/coverage.out ]; then
            echo ""
            echo "### AOP module coverage"
            go tool cover -func=aop/coverage.out | tail -1
          fi

      - name: Upload coverage artifact
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            aop/coverage.out
          retention-days: 14

  windows-test:
    runs-on: windows-2022
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        shell: bash
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Run Windows package tests
        run: go test -count=1 ./agent/... ./pkg/runner/... ./pkg/web/...

      - name: Compile and test the full CLI without cgo on Windows
        run: go test -count=1 -tags "$env:FULL_TAGS" ./cmd/aiscan
        env:
          CGO_ENABLED: "0"

      - name: Compile and test the full CLI with cgo on Windows
        run: go test -count=1 -tags "$env:FULL_TAGS" ./cmd/aiscan
        env:
          CGO_ENABLED: "1"

  scanner-functional:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Run scanner functional regressions
        run: |
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 5m -v \
            -run 'Test(ScannerFunctionalRegression|FullScannerFunctionalRegression)$' \
            ./pkg/exts/scanner

      - name: Run remaining full-tag unit variants
        run: |
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 5m \
            ./cmd/aiscan ./agent/skills ./tools/passive ./tools/scan/engine
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 5m \
            -run '^TestKatanaProfileExtender$' \
            ./tools/scan
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 5m \
            -run '^Test(Parse|Execute_|ResolvePath_|NameAndUsage|WithDefaultSession|Format)' \
            ./tools/playwright

      - name: Compile browser-backed full-tag suites
        run: |
          go test -c -tags "$FULL_CAPS_TAGS" \
            -o "$RUNNER_TEMP/headless.test" ./tools/headless
          go test -c -tags "$FULL_CAPS_TAGS" \
            -o "$RUNNER_TEMP/playwright.test" ./tools/playwright

      - name: Run full server CSTX integration
        run: |
          CGO_ENABLED=0 go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 5m \
            ./cmd/aiscan ./pkg/web/api ./pkg/web/service

  headless-record-replay-e2e:
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify Chrome discovery
        run: chrome --version

      - name: Run headless action E2E
        run: |
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 2m -v \
            -run '^(TestExecCyberExtendedActions|TestExecCyberHistoryActions)$' \
            ./tools/headless

      - name: Run authenticated record and replay E2E
        run: |
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 2m -v \
            -run '^TestE2E_RecordReplayAuthenticatedDashboard$' \
            ./tools/playwright

      - name: Run Katana browser reuse E2E
        run: |
          go test -count=1 -timeout 2m -v \
            -run '^TestE2EHeadlessReusesDiscoveredBrowser$' \
            ./tools/katana
          go test -tags "$FULL_CAPS_TAGS" -count=1 -timeout 2m -v \
            -run '^TestE2EKatanaDeepRendersAuthenticatedSPA$' \
            ./tools/scan

  e2e:
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ env.ACT != 'true' }}

      - name: Load the build editions
        run: grep -Ev '^[[:space:]]*(#|$)' editions.env >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ env.ACT != 'true' && 'npm' || '' }}
          cache-dependency-path: web/frontend/package-lock.json

      - name: Set up protoc 35.1
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        run: npm --prefix web/frontend ci

      - name: Regenerate protobuf bindings
        run: go run ./cmd/gen

      - name: Check generated protobuf bindings are committed
        run: |
          # Untracked output is drift too: a new proto yields a new binding file,
          # which `git diff` never reports.
          test -z "$(git status --porcelain -- pkg/rpc core/types web/frontend/src/gen)"
          # The AOP bindings are generated into the cyber-ui submodule, where the
          # superproject tracks only the gitlink, so a regeneration inside it is
          # invisible from here and the check has to run in the submodule.
          test -z "$(git -C web/frontend/cyber-ui status --porcelain -- packages/aop/src/gen/aop)"

      - name: Build embedded frontend
        run: |
          npm --prefix web/frontend run build
          test -s web/static/index.html

      - name: Install Playwright Chromium
        working-directory: web/frontend
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 3m npx playwright install chromium; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "Playwright Chromium install failed, retrying ($attempt/3)..."
            sleep $((attempt * 5))
          done

      - name: Run frontend Playwright E2E
        working-directory: web/frontend
        run: npm run test:e2e

      - name: Run cyber-ui viewer tests
        working-directory: web/frontend/cyber-ui
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @cyber/viewer test

      - name: Run backend E2E tests
        run: |
          go test -race -count=1 -timeout 10m \
            -tags "e2e" \
            -v \
            ./pkg/web/...

      - name: Repeat connection shutdown regressions
        run: go test -race -count=100 -timeout 2m ./pkg/web

  release-verify:
    needs: [windows-test, scanner-functional, headless-record-replay-e2e, e2e]
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v0.0.0-ci.${{ github.run_id }}
      ref: ${{ github.sha }}
