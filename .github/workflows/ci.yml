name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gates (independent, no deps) ──────────────────────────

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Run golangci-lint
        id: golangci_lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m --build-tags "re2_cgo re2_static"

      - name: Report lint warnings
        if: steps.golangci_lint.outcome == 'failure'
        run: |
          echo "::warning::golangci-lint reported issues. Lint is advisory and does not block CI."
          echo "### Lint warnings" >> "$GITHUB_STEP_SUMMARY"
          echo "golangci-lint reported issues. Review the annotations above; this check is non-blocking." >> "$GITHUB_STEP_SUMMARY"

  tidy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null 2>&1; then
            echo "::error::go.mod is not tidy. Run 'go mod tidy' and commit the result."
            diff go.mod.orig go.mod || true
            exit 1
          fi
          if ! diff -q go.sum go.sum.orig >/dev/null 2>&1; then
            echo "::error::go.sum is not tidy. Run 'go mod tidy' and commit the result."
            diff go.sum.orig go.sum | head -30 || true
            exit 1
          fi

  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check dependency layers, registered skips, and repository debt
        run: go test -count=1 ./core/deps

      - name: Ensure the standard CLI does not depend on libcstx
        run: |
          if CGO_ENABLED=0 go list -deps -tags "forceposix emptytemplates noembed osusergo netgo" ./cmd/aiscan \
            | grep -q '^github.com/chainreactors/libcstx/go$'; then
            echo "::error::standard aiscan unexpectedly depends on libcstx"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check whitespace and submodule pins
        run: |
          git diff --check HEAD
          git diff --exit-code --submodule=diff
          git submodule foreach --recursive 'test -z "$(git status --porcelain)"'

  # ── Unit tests (depends on tidy) ──────────────────────────────

  test:
    runs-on: ubuntu-22.04
    needs: [tidy, quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Generate embedded resources
        run: go generate ./core/resources/...

      - name: Run unit tests with coverage
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Display coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Total coverage"
            go tool cover -func=coverage.out | tail -1
            echo ""
            echo "### Per-package coverage (top 20)"
            go tool cover -func=coverage.out | grep -E '^[a-z]' | sort -t$'\t' -k3 -rn | head -20
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ── Proxy & TMux tool tests (depends on tidy) ─────────────────

  tool-tests:
    runs-on: ubuntu-22.04
    needs: tidy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Run proxy tool tests
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m -v \
            ./tools/proxy/

      - name: Run tmux command tests
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m -v \
            -run 'Tmux|BashProxy' \
            ./pkg/commands/

      - name: Run PTY interactive session tests
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m -v \
            -run 'MultiRound|SendCtrlC' \
            ./agent/tmux/

      - name: Run agent tmux integration tests
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m -v \
            -run 'AgentTmux' \
            ./agent/

  windows-test:
    runs-on: windows-2022
    needs: [tidy, quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mingw for libcstx
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Run native Windows package tests
        run: go test -count=1 ./agent/... ./pkg/runner/... ./pkg/web/...
        env:
          CGO_ENABLED: "1"

      - name: Compile and test the full CLI on Windows
        run: go test -count=1 -tags full ./cmd/aiscan
        env:
          CGO_ENABLED: "1"

  race-stress:
    runs-on: ubuntu-22.04
    needs: [tidy, quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Repeat agent and runner concurrency tests
        run: |
          go test -race -count=20 -timeout 15m \
            -run 'Test(ConcurrentEmitWhileRegistering|SetProviderRaceWithRun|ResetDoesNotAllowConcurrentPrompt|StreamingProviderEmitsMessageUpdates)$' \
            ./agent/...
          go test -race -count=20 -timeout 15m \
            -run 'Test(StdioSameSessionFIFOOrder|StdioSessionsRunConcurrently|StdioDrainWaitsForInFlightAndQueued|RuntimeSessionDirectLoopUsesSessionScheduler|RuntimeSessionRejectsRequestsPastPendingLimit|SessionContextCancellationStopsActiveRun|ActiveRunSteersAsyncInputWithoutSecondLifecycle)$' \
            ./pkg/runner/...

      - name: Repeat web SSE, cancellation, and reload concurrency tests
        run: |
          go test -race -count=20 -timeout 20m \
            -run 'Test(BroadcastAOPEventPersistsRawEnvelope|ServeSSEWithSnapshotSubscribesBeforeReadingSnapshot|ServeSSEWithSnapshotDropsQueuedSnapshotDuplicates|SessionEventsReplayHasNoSideEffects|SessionEventsResumesAfterLastEventID|CancelRemoteScanStopsAgentAndPreservesCanceledStatus|CancelQueuedScanDoesNotWaitForConcurrencySlot|CancelTaskUsesControlChannelWhenTaskQueueIsFull|CancelTaskWaitsForSaturatedControlChannel|CompleteJobCannotOverwriteCanceledScan|BroadcastConfigReload|BroadcastConfigReloadWaitsBehindCancellationFrames|HandleConfigReloadResultUpdatesAgentStatus|SaveConfigBuildFailureKeepsCommittedConfigAndCurrentApp|SaveConfigCommitFailureClosesCandidateAndKeepsCurrentApp|SaveConfigSerializesConcurrentCandidates)$' \
            ./pkg/web

  scanner-functional:
    runs-on: ubuntu-22.04
    needs: tidy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run scanner functional regressions
        run: |
          go test -tags "full re2_cgo re2_static" -count=1 -timeout 5m -v \
            -run 'Test(ScannerFunctionalRegression|FullScannerFunctionalRegression)$' \
            ./tools

      - name: Run remaining full-tag unit variants
        run: |
          go test -tags "full re2_cgo re2_static" -count=1 -timeout 5m \
            ./cmd/aiscan ./skills ./tools/passive ./tools/scan/engine
          go test -tags "full re2_cgo re2_static" -count=1 -timeout 5m \
            -run '^TestKatanaProfileExtender$' \
            ./tools/scan
          go test -tags "full re2_cgo re2_static" -count=1 -timeout 5m \
            -run '^Test(Parse|Execute_|ResolvePath_|NameAndUsage|WithDefaultSession|Format)' \
            ./tools/playwright

      - name: Compile browser-backed full-tag suites
        run: |
          go test -c -tags "full re2_cgo re2_static" \
            -o "$RUNNER_TEMP/headless.test" ./pkg/headless
          go test -c -tags "full re2_cgo re2_static" \
            -o "$RUNNER_TEMP/playwright.test" ./tools/playwright

      - name: Run full server CSTX integration
        run: |
          CGO_ENABLED=1 go test -tags "full re2_cgo re2_static" -count=1 -timeout 5m \
            ./cmd/aiscan ./pkg/web/api ./pkg/web/service

  # ── Generated templates tests (depends on tidy) ───────────────

  generated-test:
    runs-on: ubuntu-22.04
    needs: tidy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      - name: Run go generate for templates
        run: go generate ./core/resources/...

      - name: Run resources tests
        run: |
          go test -tags "re2_cgo re2_static" -race -count=1 -timeout 5m \
            ./core/resources/...

      - name: Check generated resources are committed
        run: git diff --exit-code

  protobuf-generated:
    runs-on: ubuntu-22.04
    needs: tidy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Set up protoc 35.1
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        run: npm --prefix web/frontend ci

      - name: Regenerate protobuf bindings
        run: go run ./cmd/gen

      - name: Check generated protobuf bindings are committed
        run: git diff --exit-code

  # ── E2E tests (depends on test) ───────────────────────────────

  e2e:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build embedded frontend
        run: |
          npm --prefix web/frontend ci
          npm --prefix web/frontend run build
          test -s web/static/index.html

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: embedded-frontend
          path: web/static
          retention-days: 1

      - name: Install Playwright Chromium
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend Playwright E2E
        working-directory: web/frontend
        run: npm run test:e2e

      - name: Run cyber-ui viewer tests
        working-directory: web/frontend/cyber-ui
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @cyber/viewer test

      - name: Run e2e tests
        run: |
          go test -race -count=1 -timeout 10m \
            -tags "e2e re2_cgo re2_static" \
            -v \
            ./pkg/web

  # ── Standard build: pure Go, no libcstx/CGO ──────────────────

  build-standard:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded resources
        run: go generate ./core/resources

      - name: Build all standard platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS='/' read -r goos goarch <<< "$target"
            echo "  compile ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -tags "forceposix emptytemplates noembed osusergo netgo" \
              -ldflags "-s -w" -buildvcs=false \
              -o "dist/standard_${goos}_${goarch}" ./cmd/aiscan
          done
          ls -lh dist/

      - name: Upload standard binaries
        uses: actions/upload-artifact@v7
        with:
          name: aiscan-standard
          path: dist/standard_*
          if-no-files-found: error
          retention-days: 7

  # ── Full build: native libcstx/CGO on supported platforms ────

  build-full:
    needs: [test, e2e]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - id: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - id: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
          - id: windows-amd64
            runner: windows-2022
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mingw for libcstx
        if: runner.os == 'Windows'
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Download embedded frontend
        uses: actions/download-artifact@v7
        with:
          name: embedded-frontend
          path: web/static

      - name: Generate embedded resources
        run: go generate ./core/resources

      - name: Build full ${{ matrix.id }}
        run: |
          suffix=""
          [[ "${{ matrix.goos }}" == "windows" ]] && suffix=".exe"
          CGO_ENABLED=1 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -tags "forceposix emptytemplates noembed osusergo netgo full sqlite re2_cgo re2_static" \
            -ldflags "-s -w" -buildvcs=false \
            -o "dist/full_${{ matrix.goos }}_${{ matrix.goarch }}${suffix}" ./cmd/aiscan

      - name: Upload full ${{ matrix.id }} binary
        uses: actions/upload-artifact@v7
        with:
          name: aiscan-full-${{ matrix.id }}
          path: dist/full_*
          if-no-files-found: error
          retention-days: 7
